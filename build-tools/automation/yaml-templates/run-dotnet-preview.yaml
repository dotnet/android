parameters:
  configuration: $(XA.Build.Configuration)
  useLocalWorkload: false
  xaSourcePath: $(System.DefaultWorkingDirectory)
  command: build
  project: ''
  arguments: ''
  useExitCodeForErrors: false
  displayName: run dotnet preview
  condition: succeeded()
  continueOnError: true
  retryCountOnTaskFailure: 0
  taskTimeoutInMinutes: 0
  env: {}

steps:
- powershell: |
    $dotnet = 'dotnetup'
    $dotnetArguments = @('dotnet', '--')
    if ([System.Convert]::ToBoolean("${{ parameters.useLocalWorkload }}")) {
        $wrapper = if ($env:OS -eq 'Windows_NT') { 'dotnet-local.cmd' } else { 'dotnet-local.sh' }
        $dotnet = Join-Path "${{ parameters.xaSourcePath }}" $wrapper
        $dotnetArguments = @()
    }
    Set-Location "${{ parameters.xaSourcePath }}"
    & $dotnet @dotnetArguments ${{ parameters.command }} ${{ parameters.project }} ${{ parameters.arguments }}
    if ([System.Convert]::ToBoolean("${{ parameters.useExitCodeForErrors }}") -and $LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]Test suite had $LASTEXITCODE failure(s)."
        Write-Host "##vso[task.complete result=Failed;]"
        exit 0
    }
  displayName: ${{ parameters.displayName }}
  condition: ${{ parameters.condition }}
  continueOnError: ${{ parameters.continueOnError }}
  retryCountOnTaskFailure: ${{ parameters.retryCountOnTaskFailure }}
  timeoutInMinutes: ${{ parameters.taskTimeoutInMinutes }}
  env:
    ${{ if eq(parameters.useLocalWorkload, true) }}:
      CONFIGURATION: ${{ parameters.configuration }}
    ${{ each variable in parameters.env }}:
      ${{ variable.key }}: ${{ variable.value }}
