parameters:
  configuration: $(XA.Build.Configuration)
  xaSourcePath: $(System.DefaultWorkingDirectory)
  command: build
  project: ''
  arguments: ''
  useExitCodeForErrors: false
  displayName: run dotnet preview
  condition: succeeded()
  continueOnError: true
  retryCountOnTaskFailure: 0
  taskTimeoutInMinutes: 0
  processTimeoutInMinutes: 0
  processRetryCount: 0
  processRetryDelaySeconds: 1
  env: {}

steps:
- powershell: |
    if ([Environment]::OSVersion.Platform -eq "Unix") {
        $DOTNET_ROOT = "${{ parameters.xaSourcePath }}/bin/${{ parameters.configuration }}/dotnet"
        $env:PATH = "${DOTNET_ROOT}:$env:PATH"
        $dotnetPath = "${DOTNET_ROOT}/dotnet"
    } else {
        $DOTNET_ROOT = "${{ parameters.xaSourcePath }}\bin\${{ parameters.configuration }}\dotnet"
        $env:PATH = "${DOTNET_ROOT};$env:PATH"
        $dotnetPath = "${DOTNET_ROOT}\dotnet.exe"
    }
    $processTimeoutInMinutes = [int] "${{ parameters.processTimeoutInMinutes }}"
    if ($processTimeoutInMinutes -gt 0) {
        $dotnetArguments = @'
    ${{ parameters.command }} ${{ parameters.project }} ${{ parameters.arguments }}
    '@.Trim()
        & "${{ parameters.xaSourcePath }}/build-tools/automation/scripts/Invoke-ProcessWithRetry.ps1" `
            -FilePath $dotnetPath `
            -Arguments $dotnetArguments `
            -TimeoutSeconds ($processTimeoutInMinutes * 60) `
            -RetryCount ${{ parameters.processRetryCount }} `
            -RetryDelaySeconds ${{ parameters.processRetryDelaySeconds }}
    } else {
        & $dotnetPath ${{ parameters.command }} ${{ parameters.project }} ${{ parameters.arguments }}
    }
    if ([System.Convert]::ToBoolean("${{ parameters.useExitCodeForErrors }}") -and $LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]Test suite had $LASTEXITCODE failure(s)."
        Write-Host "##vso[task.complete result=Failed;]"
        exit 0
    }
  displayName: ${{ parameters.displayName }}
  condition: ${{ parameters.condition }}
  continueOnError: ${{ parameters.continueOnError }}
  retryCountOnTaskFailure: ${{ parameters.retryCountOnTaskFailure }}
  timeoutInMinutes: ${{ parameters.taskTimeoutInMinutes }}
  ${{ if parameters.env }}:
    env: ${{ parameters.env }}
