# This template installs the pinned .NET SDK version.
# We prefer this over the UseDotNet task so that we can always clean up old/unstable versions on disk.

parameters:
  version: $(DotNetSdkVersion)
  remove_dotnet: false
  retryCountOnTaskFailure: 3

steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $ProgressPreference = 'SilentlyContinue'
      $DotNetRoot = "$env:ProgramFiles\dotnet\"
      if ("${{ parameters.remove_dotnet }}" -eq $true) {
          Remove-Item -Recurse $DotNetRoot -Verbose
      }
      $currentAttempt = 1
      $totalAttempts = 5
      $sleepTime = 5
      $completed = $false
      while (-not $completed -and $currentAttempt -le $totalAttempts) {
          try {
              $response = Invoke-WebRequest -Uri "https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1" -OutFile dotnet-install.ps1 -PassThru
              if ($response.StatusCode -ne 200) {
                  throw
              }
              $completed = $true
          } catch {
              if ($currentAttempt -eq $totalAttempts) {
                  Write-Host "Unable to download 'dotnet-install.ps1' after $currentAttempt attempts."
                  throw
              }
              Write-Host $_.Exception
              Write-Host "Retrying after $sleepTime seconds..."
              Start-Sleep $sleepTime
              $currentAttempt++
              $sleepTime = $sleepTime * 2
          }
      }
      & .\dotnet-install.ps1 -Version ${{ parameters.version }} -InstallDir $DotNetRoot -SkipNonVersionedFiles -Verbose
    displayName: install .NET Core ${{ parameters.version }}
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))
    retryCountOnTaskFailure: ${{ parameters.retryCountOnTaskFailure }}

  # Hosted macOS images can have a non-writable ~/.dotnet. DOTNET_ROOT only moves
  # the SDK, so isolate CLI first-run state too. Keep NuGet config, credentials,
  # and caches in the existing home; leave HOME and existing tool paths unchanged.
  - bash: >
      DOTNET_ROOT="$(Agent.TempDirectory)/dotnet-bootstrap" &&
      DOTNET_CLI_HOME="$(mktemp -d "$(Agent.TempDirectory)/dotnet-cli-home.XXXXXX")" &&
      mkdir -p "$HOME/.nuget" "$HOME/.local/share" &&
      ln -s "$HOME/.nuget" "$DOTNET_CLI_HOME/.nuget" &&
      ln -s "$HOME/.local" "$DOTNET_CLI_HOME/.local" &&
      (if [[ "${{ parameters.remove_dotnet }}" == "true" ]] ; then rm -rfv "$DOTNET_ROOT"; fi) &&
      curl -L https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh --retry 5 --retry-max-time 300 > dotnet-install.sh &&
      chmod +x dotnet-install.sh &&
      ./dotnet-install.sh --version ${{ parameters.version }} --install-dir "$DOTNET_ROOT" --skip-non-versioned-files --verbose &&
      PATH="$DOTNET_ROOT:$DOTNET_CLI_HOME/.dotnet/tools:$HOME/.dotnet/tools:$PATH" &&
      echo "##vso[task.setvariable variable=DOTNET_ROOT]$DOTNET_ROOT" &&
      echo "##vso[task.setvariable variable=DOTNET_CLI_HOME]$DOTNET_CLI_HOME" &&
      echo "##vso[task.setvariable variable=PATH]$PATH"
    displayName: install .NET Core ${{ parameters.version }}
    condition: and(succeeded(), ne(variables['agent.os'], 'Windows_NT'))
    retryCountOnTaskFailure: ${{ parameters.retryCountOnTaskFailure }}

  - script: dotnet --info
    displayName: display dotnet --info
