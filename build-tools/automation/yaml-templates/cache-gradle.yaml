# Shared Gradle dependency cache template
# Gives each job a clean Gradle user home while caching downloads between
# pipeline runs to avoid transient network failures when resolving Maven
# dependencies or downloading the Gradle distribution itself.
#
# Two caches are used, because they have different invalidation rules:
#
#   * caches/modules-2 - resolved Maven dependencies. Keyed on the Gradle build
#                       files that declare them.
#   * wrapper/dists    - the Gradle distribution .zip downloaded by the Gradle
#                       wrapper. Keyed only on gradle-wrapper.properties.
#
# Mutable caches, transforms, and daemon registry state are intentionally not
# restored across jobs.
#
# Without the second cache every agent re-downloads the distribution from
# services.gradle.org (which redirects to github.com). A transient HTTP 5xx
# there fails `gradlew` for every Gradle test running on that agent.
#
# See: https://learn.microsoft.com/azure/devops/pipelines/release/caching

parameters:
  xaSourcePath: $(System.DefaultWorkingDirectory)/android

steps:
- pwsh: |
    git log -1 --format=%H external/Java.Interop > $(Agent.TempDirectory)/java-interop-submodule-hash.txt
    $gradleUserHome = Join-Path "$(Agent.TempDirectory)" "gradle-user-home"
    if (Test-Path -LiteralPath $gradleUserHome) {
      Remove-Item -LiteralPath $gradleUserHome -Recurse -Force
    }
    $gradleDependencyCacheDir = Join-Path $gradleUserHome "caches/modules-2"
    $gradleDistsDir = Join-Path $gradleUserHome "wrapper/dists"
    New-Item -ItemType Directory -Path $gradleDependencyCacheDir, $gradleDistsDir -Force | Out-Null
    Write-Host "##vso[task.setvariable variable=GRADLE_USER_HOME]$gradleUserHome"
  workingDirectory: ${{ parameters.xaSourcePath }}
  displayName: prepare isolated Gradle state

- task: Cache@2
  displayName: cache Gradle dependencies
  inputs:
    key: '"gradle" | "v2" | "$(Agent.OS)" | ${{ parameters.xaSourcePath }}/build-tools/gradle/gradle/wrapper/gradle-wrapper.properties | ${{ parameters.xaSourcePath }}/src/**/build.gradle | $(Agent.TempDirectory)/java-interop-submodule-hash.txt'
    restoreKeys: |
      "gradle" | "v2" | "$(Agent.OS)"
    path: $(GRADLE_USER_HOME)/caches/modules-2

- task: Cache@2
  displayName: cache Gradle distributions
  inputs:
    # No `restoreKeys` fallback: a partial restore would bring back a
    # distribution the wrapper cannot use, and Cache@2 would then save the old
    # and new distributions together under the new key, growing the cache on
    # every version bump. An exact-key miss re-downloads only the new version.
    key: '"gradle-dists" | "v2" | "$(Agent.OS)" | ${{ parameters.xaSourcePath }}/build-tools/gradle/gradle/wrapper/gradle-wrapper.properties'
    path: $(GRADLE_USER_HOME)/wrapper/dists
