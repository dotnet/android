parameters:
  condition: succeeded()
  xaSourcePath: $(System.DefaultWorkingDirectory)

steps:
- powershell: |
    $scriptPath = Join-Path '${{ parameters.xaSourcePath }}' 'build-tools/automation/scripts/FailOnUnexpectedIssues.ps1'
    & $scriptPath
  name: failOnUnexpectedIssues
  displayName: fail if any issues occurred
  condition: ${{ parameters.condition }}
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
