parameters:
  condition: succeeded()
  xaSourcePath: $(System.DefaultWorkingDirectory)

steps:
- powershell: |
    & '${{ parameters.xaSourcePath }}/build-tools/automation/scripts/FailOnUnexpectedIssues.ps1'
  name: failOnUnexpectedIssues
  displayName: fail if any issues occurred
  condition: ${{ parameters.condition }}
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
