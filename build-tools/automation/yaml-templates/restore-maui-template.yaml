parameters:
  project:
  nugetConfig:
  xaSourcePath:
  logsDirectory:
  configuration: $(XA.Build.Configuration)

steps:
- powershell: |
    & '${{ parameters.xaSourcePath }}/build-tools/automation/scripts/RestoreMauiTemplate.Tests.ps1'
  displayName: Test MAUI template restore retry

- powershell: |
    if ([Environment]::OSVersion.Platform -eq "Unix") {
        $dotnetPath = "${{ parameters.xaSourcePath }}/bin/${{ parameters.configuration }}/dotnet/dotnet"
    } else {
        $dotnetPath = "${{ parameters.xaSourcePath }}\bin\${{ parameters.configuration }}\dotnet\dotnet.exe"
    }

    & '${{ parameters.xaSourcePath }}/build-tools/automation/scripts/RestoreMauiTemplate.ps1' `
      -DotNetPath $dotnetPath `
      -Project '${{ parameters.project }}' `
      -NuGetConfig '${{ parameters.nugetConfig }}' `
      -BinaryLogPath '${{ parameters.logsDirectory }}/MauiTestProj-Restore.binlog'
  displayName: Restore MAUI template dependencies
