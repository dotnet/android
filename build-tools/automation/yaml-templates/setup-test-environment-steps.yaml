# Shared test environment setup steps for both public and private pipelines
# This template contains the actual setup logic without references to private repos

parameters:
  configuration: $(XA.Build.Configuration)
  xaSourcePath: $(System.DefaultWorkingDirectory)
  jdkMajorVersion: $(DefaultJavaSdkMajorVersion)
  useAgentJdkPath: true
  dotnetVersion: $(DotNetSdkVersion)
  installTestSlicer: false
  installApkDiff: true
  androidSdkPlatforms: $(DefaultTestSdkPlatforms)
  use1ESTemplate: true

steps:
- template: /build-tools/automation/yaml-templates/setup-jdk-variables.yaml
  parameters:
    jdkMajorVersion: ${{ parameters.jdkMajorVersion }}
    useAgentJdkPath: ${{ parameters.useAgentJdkPath }}

# Install the repository SDK and the runtime needed by host-side tests.
- template: /build-tools/automation/yaml-templates/install-repository-sdk.yaml
  parameters:
    xaSourcePath: ${{ parameters.xaSourcePath }}
    toolingSdkVersion: ${{ parameters.dotnetVersion }}

- pwsh: dotnetup dotnet build-server shutdown
  displayName: shut down existing build daemons
  workingDirectory: ${{ parameters.xaSourcePath }}

- template: /build-tools/automation/yaml-templates/cache-android-archives.yaml
  parameters:
    xaSourcePath: ${{ parameters.xaSourcePath }}
    condition: and(succeeded(), eq(variables['agent.os'], 'Darwin'))

- pwsh: >-
    dotnetup dotnet build "${{ parameters.xaSourcePath }}/src/workloads/workloads.csproj"
    -c ${{ parameters.configuration }} -bl:${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/workloads.binlog
  displayName: restore CoreCLR Android runtime packs
  workingDirectory: ${{ parameters.xaSourcePath }}

- pwsh: >-
    dotnetup dotnet build "${{ parameters.xaSourcePath }}/build-tools/Xamarin.Android.Tools.BootstrapTasks/Xamarin.Android.Tools.BootstrapTasks.csproj"
    -c ${{ parameters.configuration }} -bl:${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/BootstrapTasks.binlog
  displayName: build Xamarin.Android.Tools.BootstrapTasks.csproj
  workingDirectory: ${{ parameters.xaSourcePath }}

- template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
  parameters:
    displayName: install OpenJDK and accept Android SDK licenses
    xaSourcePath: ${{ parameters.xaSourcePath }}
    project: ${{ parameters.xaSourcePath }}/src/androidsdk/androidsdk.csproj
    arguments: -c ${{ parameters.configuration }} -bl:${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/androidsdk.binlog
    continueOnError: false
    retryCountOnTaskFailure: 2
    env:
      AndroidSdkPlatforms: ${{ parameters.androidSdkPlatforms }}

# Download and install .NET nupkgs
- task: DownloadPipelineArtifact@2
  inputs:
    artifactName: $(NuGetArtifactName)
    downloadPath: ${{ parameters.xaSourcePath }}/bin/Build${{ parameters.configuration }}/nuget-unsigned

- task: DownloadPipelineArtifact@2
  inputs:
    artifactName: $(LinuxNuGetArtifactName)
    downloadPath: ${{ parameters.xaSourcePath }}/bin/Build${{ parameters.configuration }}/nuget-unsigned
  condition: and(succeeded(), eq(variables['agent.os'], 'Linux'))

- template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
  parameters:
    displayName: extract workload packs
    xaSourcePath: ${{ parameters.xaSourcePath }}
    project: ${{ parameters.xaSourcePath }}/build-tools/create-packs/Microsoft.Android.Sdk.proj
    arguments: -t:ExtractWorkloadPacks -c ${{ parameters.configuration }} -v:n -bl:${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/extract-workloads.binlog
    continueOnError: false
    retryCountOnTaskFailure: 2

- ${{ if eq(parameters.installApkDiff, true) }}:
  - template: /build-tools/automation/yaml-templates/install-dotnet-tool.yaml
    parameters:
      toolName: apkdiff
      version: $(ApkDiffToolVersion)
      xaSourcePath: ${{ parameters.xaSourcePath }}

- ${{ if eq(parameters.installTestSlicer, true) }}:
  - template: /build-tools/automation/yaml-templates/install-dotnet-tool.yaml
    parameters:
      toolName: dotnet-test-slicer
      version: $(TestSlicerToolVersion)
      xaSourcePath: ${{ parameters.xaSourcePath }}
