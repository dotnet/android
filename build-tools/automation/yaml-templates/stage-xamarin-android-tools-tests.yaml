# xamarin-android-tools tests stage
#
# Builds the in-tree Android tools projects and runs their unit tests.
#
# This stage does not pack a NuGet or publish binaries because dotnet/android's
# product build produces the shipping assemblies. Only logs and test results are
# surfaced.
#
# Referenced from both:
#   - build-tools/automation/azure-pipelines.yaml         (official / 1ES)
#   - build-tools/automation/azure-pipelines-public.yaml  (public PR validation)

parameters:
- name: stageName
  type: string
  default: xamarin_android_tools_tests
- name: dependsOn
  type: object
  default: []
- name: condition
  type: string
  default: succeeded()
- name: use1ESTemplate
  type: boolean
  default: false
- name: windowsPool
  type: object
  # NOTE: This default is a Microsoft-hosted Azure Pipelines pool, which is NOT
  # allowed by 1ES Pipeline Templates in Official mode. Callers that extend the
  # 1ES Official template (e.g. build-tools/automation/azure-pipelines.yaml) must
  # override this with a 1ES-hosted pool like `MAUI-1ESPT`.
  default:
    name: Azure Pipelines
    vmImage: $(HostedWinImage)
    os: windows
- name: macPool
  type: object
  default:
    name: Azure Pipelines
    vmImage: $(HostedMacImage)
    os: macOS

stages:
- stage: ${{ parameters.stageName }}
  displayName: Android Tools Tests
  dependsOn: ${{ parameters.dependsOn }}
  condition: ${{ parameters.condition }}
  variables:
    XatBuildProperties: -p:AndroidToolsDisableMultiTargeting=false -p:DotNetTargetFrameworkVersion=$(DotNetSdkChannel)
  jobs:

  # Check - "Xamarin.Android (Android Tools Tests Windows - .NET)"
  - job: xamarin_android_tools_windows
    displayName: Windows - .NET
    pool: ${{ parameters.windowsPool }}
    timeoutInMinutes: 30
    workspace:
      clean: all
    ${{ if eq(parameters.use1ESTemplate, true) }}:
      templateContext:
        outputs:
        - output: pipelineArtifact
          displayName: Upload build logs
          condition: always()
          targetPath: $(Build.ArtifactStagingDirectory)
          artifactName: android-tools-logs-windows
          sbomEnabled: false
    steps:
    - checkout: self
      clean: true

    - template: /build-tools/automation/yaml-templates/install-repository-sdk.yaml

    - pwsh: |
        foreach ($project in @(
          'src/Xamarin.Android.Tools.AndroidSdk/Xamarin.Android.Tools.AndroidSdk.csproj',
          'tests/Xamarin.Android.Tools.Benchmarks/Xamarin.Android.Tools.Benchmarks.csproj'
        )) {
          dotnetup dotnet build $project -c Debug $(XatBuildProperties) "-bl:$(Build.ArtifactStagingDirectory)/$([IO.Path]::GetFileNameWithoutExtension($project))-windows.binlog"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
      displayName: Build Android tools projects
      workingDirectory: $(System.DefaultWorkingDirectory)

    - pwsh: |
        $result = 0
        foreach ($project in @(
          'tests/Microsoft.Android.Build.BaseTasks-Tests/Microsoft.Android.Build.BaseTasks-Tests.csproj',
          'tests/Xamarin.Android.Tools.AndroidSdk-Tests/Xamarin.Android.Tools.AndroidSdk-Tests.csproj'
        )) {
          dotnetup dotnet test $project -c Debug $(XatBuildProperties) --logger trx --results-directory "$(Agent.TempDirectory)/android-tools-tests"
          if ($LASTEXITCODE -ne 0) { $result = $LASTEXITCODE }
        }
        exit $result
      displayName: Run Tests
      workingDirectory: $(System.DefaultWorkingDirectory)

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: $(Agent.TempDirectory)/android-tools-tests/*.trx
        testRunTitle: Android tools tests - Windows

    - ${{ if eq(parameters.use1ESTemplate, false) }}:
      - task: PublishBuildArtifacts@1
        displayName: Upload build logs
        condition: always()
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
          artifactName: android-tools-logs-windows

  # Check - "Xamarin.Android (Android Tools Tests Mac - .NET)"
  - job: xamarin_android_tools_mac
    displayName: Mac - .NET
    pool: ${{ parameters.macPool }}
    timeoutInMinutes: 30
    workspace:
      clean: all
    ${{ if eq(parameters.use1ESTemplate, true) }}:
      templateContext:
        outputs:
        - output: pipelineArtifact
          displayName: Upload build logs
          condition: always()
          targetPath: $(Build.ArtifactStagingDirectory)
          artifactName: android-tools-logs-mac
          sbomEnabled: false
    steps:
    - checkout: self
      clean: true

    - template: /build-tools/automation/yaml-templates/install-repository-sdk.yaml

    - pwsh: |
        foreach ($project in @(
          'src/Xamarin.Android.Tools.AndroidSdk/Xamarin.Android.Tools.AndroidSdk.csproj',
          'tests/Xamarin.Android.Tools.Benchmarks/Xamarin.Android.Tools.Benchmarks.csproj'
        )) {
          dotnetup dotnet build $project -c Debug $(XatBuildProperties) "-bl:$(Build.ArtifactStagingDirectory)/$([IO.Path]::GetFileNameWithoutExtension($project))-mac.binlog"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
      displayName: Build Android tools projects
      workingDirectory: $(System.DefaultWorkingDirectory)

    - pwsh: |
        $result = 0
        foreach ($project in @(
          'tests/Microsoft.Android.Build.BaseTasks-Tests/Microsoft.Android.Build.BaseTasks-Tests.csproj',
          'tests/Xamarin.Android.Tools.AndroidSdk-Tests/Xamarin.Android.Tools.AndroidSdk-Tests.csproj'
        )) {
          dotnetup dotnet test $project -c Debug $(XatBuildProperties) --logger trx --results-directory "$(Agent.TempDirectory)/android-tools-tests"
          if ($LASTEXITCODE -ne 0) { $result = $LASTEXITCODE }
        }
        exit $result
      displayName: Run Tests
      workingDirectory: $(System.DefaultWorkingDirectory)

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: $(Agent.TempDirectory)/android-tools-tests/*.trx
        testRunTitle: Android tools tests - macOS

    - ${{ if eq(parameters.use1ESTemplate, false) }}:
      - task: PublishBuildArtifacts@1
        displayName: Upload build logs
        condition: always()
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
          artifactName: android-tools-logs-mac
