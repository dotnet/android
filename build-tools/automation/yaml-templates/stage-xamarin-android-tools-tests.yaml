# xamarin-android-tools tests stage
#
# Builds the in-tree Android tools projects and runs their unit tests.
#
# This stage does not pack a NuGet or publish binaries because dotnet/android's
# product build produces the shipping assemblies. Only logs and test results are
# surfaced.
#
# Referenced from both:
#   - build-tools/automation/azure-pipelines.yaml         (official / 1ES)
#   - build-tools/automation/azure-pipelines-public.yaml  (public PR validation)

parameters:
- name: stageName
  type: string
  default: xamarin_android_tools_tests
- name: dependsOn
  type: object
  default: []
- name: condition
  type: string
  default: succeeded()
- name: use1ESTemplate
  type: boolean
  default: false
- name: windowsPool
  type: object
  # NOTE: This default is a Microsoft-hosted Azure Pipelines pool, which is NOT
  # allowed by 1ES Pipeline Templates in Official mode. Callers that extend the
  # 1ES Official template (e.g. build-tools/automation/azure-pipelines.yaml) must
  # override this with a 1ES-hosted pool like `MAUI-1ESPT`.
  default:
    name: Azure Pipelines
    vmImage: $(HostedWinImage)
    os: windows
- name: macPool
  type: object
  default:
    name: Azure Pipelines
    vmImage: $(HostedMacImage)
    os: macOS

stages:
- stage: ${{ parameters.stageName }}
  displayName: Android Tools Tests
  dependsOn: ${{ parameters.dependsOn }}
  condition: ${{ parameters.condition }}
  variables:
    DotNetCoreVersion: $(DotNetSdkVersion).x
    XatBuildProperties: -p:AndroidToolsDisableMultiTargeting=false -p:DotNetTargetFrameworkVersion=$(DotNetSdkVersion)
  jobs:

  # Check - "Xamarin.Android (Android Tools Tests Windows - .NET)"
  - job: xamarin_android_tools_windows
    displayName: Windows - .NET
    pool: ${{ parameters.windowsPool }}
    timeoutInMinutes: 30
    workspace:
      clean: all
    ${{ if eq(parameters.use1ESTemplate, true) }}:
      templateContext:
        outputs:
        - output: pipelineArtifact
          displayName: Upload build logs
          condition: always()
          targetPath: $(Build.ArtifactStagingDirectory)
          artifactName: android-tools-logs-windows
          sbomEnabled: false
    steps:
    - checkout: self
      clean: true

    - task: UseDotNet@2
      displayName: Use .NET Core $(DotNetCoreVersion)
      inputs:
        version: $(DotNetCoreVersion)

    - task: DotNetCoreCLI@2
      displayName: Build Android tools projects
      inputs:
        command: build
        projects: |
          $(System.DefaultWorkingDirectory)/tests/Xamarin.Android.Tools.Benchmarks/Xamarin.Android.Tools.Benchmarks.csproj
        arguments: -c Debug $(XatBuildProperties) -bl:$(Build.ArtifactStagingDirectory)/build-windows.binlog

    - task: DotNetCoreCLI@2
      displayName: Run Tests
      inputs:
        command: test
        projects: |
          $(System.DefaultWorkingDirectory)/tests/Microsoft.Android.Build.BaseTasks-Tests/Microsoft.Android.Build.BaseTasks-Tests.csproj
        arguments: -c Debug $(XatBuildProperties)

    - pwsh: |
        & "$(System.DefaultWorkingDirectory)/eng/install-dotnet.ps1" -configuration Debug
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Install pinned .NET SDK for Android SDK fixtures

    - template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
      parameters:
        configuration: Debug
        project: src/Xamarin.Android.Tools.AndroidSdk/Xamarin.Android.Tools.AndroidSdk.csproj
        arguments: -c Debug -p:AndroidToolsDisableMultiTargeting=false -p:DotNetTargetFrameworkVersion=11.0 -bl:$(Build.ArtifactStagingDirectory)/sdk-build-windows.binlog
        displayName: Build Android SDK tools with the pinned SDK
        continueOnError: false

    - template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
      parameters:
        configuration: Debug
        project: tools/ls-jdks/ls-jdks.csproj
        arguments: -c Debug -p:AndroidToolsDisableMultiTargeting=false -p:DotNetTargetFrameworkVersion=11.0 -bl:$(Build.ArtifactStagingDirectory)/sdk-jdks-windows.binlog
        displayName: Build JDK discovery tool with the pinned SDK
        continueOnError: false

    - template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
      parameters:
        configuration: Debug
        command: test
        project: tests/Xamarin.Android.Tools.AndroidSdk-Tests/Xamarin.Android.Tools.AndroidSdk-Tests.csproj
        arguments: >-
          -c Debug -p:AndroidToolsDisableMultiTargeting=false -p:DotNetTargetFrameworkVersion=11.0
          --logger trx --results-directory "$(Agent.TempDirectory)/android-sdk-fixtures-windows"
          -- RunConfiguration.DotNetHostPath="$(System.DefaultWorkingDirectory)/bin/Debug/dotnet/dotnet.exe"
        displayName: Run Android SDK fixture tests
        continueOnError: false

    - task: PublishTestResults@2
      displayName: Publish Android SDK fixture results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: "$(Agent.TempDirectory)/android-sdk-fixtures-windows/*.trx"
        testRunTitle: Android SDK fixtures - Windows

    - ${{ if eq(parameters.use1ESTemplate, false) }}:
      - task: PublishBuildArtifacts@1
        displayName: Upload build logs
        condition: always()
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
          artifactName: android-tools-logs-windows

  # Check - "Xamarin.Android (Android Tools Tests Mac - .NET)"
  - job: xamarin_android_tools_mac
    displayName: Mac - .NET
    pool: ${{ parameters.macPool }}
    timeoutInMinutes: 30
    workspace:
      clean: all
    ${{ if eq(parameters.use1ESTemplate, true) }}:
      templateContext:
        outputs:
        - output: pipelineArtifact
          displayName: Upload build logs
          condition: always()
          targetPath: $(Build.ArtifactStagingDirectory)
          artifactName: android-tools-logs-mac
          sbomEnabled: false
    steps:
    - checkout: self
      clean: true

    - task: UseDotNet@2
      displayName: Use .NET Core $(DotNetCoreVersion)
      inputs:
        version: $(DotNetCoreVersion)

    - task: DotNetCoreCLI@2
      displayName: Build Android tools projects
      inputs:
        command: build
        projects: |
          $(System.DefaultWorkingDirectory)/tests/Xamarin.Android.Tools.Benchmarks/Xamarin.Android.Tools.Benchmarks.csproj
        arguments: -c Debug $(XatBuildProperties) -bl:$(Build.ArtifactStagingDirectory)/build-mac.binlog

    - task: DotNetCoreCLI@2
      displayName: Run Tests
      inputs:
        command: test
        projects: |
          $(System.DefaultWorkingDirectory)/tests/Microsoft.Android.Build.BaseTasks-Tests/Microsoft.Android.Build.BaseTasks-Tests.csproj
        arguments: -c Debug $(XatBuildProperties)

    - bash: bash "$(System.DefaultWorkingDirectory)/eng/install-dotnet.sh"
      displayName: Install pinned .NET SDK for Android SDK fixtures
      env:
        CONFIGURATION: Debug

    - template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
      parameters:
        configuration: Debug
        project: src/Xamarin.Android.Tools.AndroidSdk/Xamarin.Android.Tools.AndroidSdk.csproj
        arguments: -c Debug -p:AndroidToolsDisableMultiTargeting=false -p:DotNetTargetFrameworkVersion=11.0 -bl:$(Build.ArtifactStagingDirectory)/sdk-build-mac.binlog
        displayName: Build Android SDK tools with the pinned SDK
        continueOnError: false

    - template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
      parameters:
        configuration: Debug
        project: tools/ls-jdks/ls-jdks.csproj
        arguments: -c Debug -p:AndroidToolsDisableMultiTargeting=false -p:DotNetTargetFrameworkVersion=11.0 -bl:$(Build.ArtifactStagingDirectory)/sdk-jdks-mac.binlog
        displayName: Build JDK discovery tool with the pinned SDK
        continueOnError: false

    - template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
      parameters:
        configuration: Debug
        command: test
        project: tests/Xamarin.Android.Tools.AndroidSdk-Tests/Xamarin.Android.Tools.AndroidSdk-Tests.csproj
        arguments: >-
          -c Debug -p:AndroidToolsDisableMultiTargeting=false -p:DotNetTargetFrameworkVersion=11.0
          --logger trx --results-directory "$(Agent.TempDirectory)/android-sdk-fixtures-mac"
          -- RunConfiguration.DotNetHostPath="$(System.DefaultWorkingDirectory)/bin/Debug/dotnet/dotnet"
        displayName: Run Android SDK fixture tests
        continueOnError: false

    - task: PublishTestResults@2
      displayName: Publish Android SDK fixture results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: "$(Agent.TempDirectory)/android-sdk-fixtures-mac/*.trx"
        testRunTitle: Android SDK fixtures - macOS

    - ${{ if eq(parameters.use1ESTemplate, false) }}:
      - task: PublishBuildArtifacts@1
        displayName: Upload build logs
        condition: always()
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
          artifactName: android-tools-logs-mac
