parameters:
  buildConfiguration: $(XA.Build.Configuration)
  configuration: $(XA.Build.Configuration)
  xaSourcePath: $(System.DefaultWorkingDirectory)
  testName: ""
  project: ""
  extraBuildArgs: ""
  testResultsFormat: VSTest
  artifactSource: ""
  artifactFolder: ""
  condition: succeeded()

steps:
  # Run dotnet test from the project directory so it finds the project-local
  # global.json with "test": { "runner": "Microsoft.Testing.Platform" }.
  # This enables MTP mode, which uses RunCommand/RunArguments to invoke
  # Microsoft.Android.Run for on-device test execution.
- powershell: |
    $projectDir = Split-Path -Parent "${{ parameters.project }}"
    $projectFile = Split-Path -Leaf "${{ parameters.project }}"
    $resultsDir = "${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/TestResults"
    Push-Location $projectDir
    if ([Environment]::OSVersion.Platform -eq "Unix") {
        $DOTNET_ROOT = "${{ parameters.xaSourcePath }}/bin/${{ parameters.buildConfiguration }}/dotnet"
        $env:PATH = "${DOTNET_ROOT}:$env:PATH"
        $dotnetPath = "${DOTNET_ROOT}/dotnet"
    } else {
        $DOTNET_ROOT = "${{ parameters.xaSourcePath }}\bin\${{ parameters.buildConfiguration }}\dotnet"
        $env:PATH = "${DOTNET_ROOT};$env:PATH"
        $dotnetPath = "${DOTNET_ROOT}\dotnet.exe"
    }
    & $dotnetPath test $projectFile -bl:${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/run-${{ parameters.testName }}.binlog -c ${{ parameters.configuration }} --results-directory $resultsDir --report-trx --report-trx-filename ${{ parameters.testName }}.trx --output Detailed ${{ parameters.extraBuildArgs }}
    Pop-Location
  displayName: run ${{ parameters.testName }}
  condition: ${{ parameters.condition }}
  continueOnError: true

  # If the install above failed, snapshot device state so we can classify WHY on
  # the next iteration instead of guessing: connectivity (adb devices/get-state),
  # disk pressure (df), storage-service readiness (the StorageStatsManager NPE
  # from install-create), boot completion, and how many test apps have piled up.
  # Best-effort and time-bounded so it never hangs or fails the lane itself.
- script: |
    set +e
    echo "===== adb devices -l ====="; adb devices -l
    echo "===== adb get-state ====="; adb get-state
    echo "===== boot completion ====="; adb shell getprop sys.boot_completed; adb shell getprop dev.bootcomplete
    echo "===== df /data ====="; adb shell df /data
    echo "===== df /storage/emulated/0 ====="; adb shell df /storage/emulated/0
    echo "===== dumpsys diskstats ====="; adb shell dumpsys diskstats
    echo "===== storaged (storage stats service) ====="; adb shell dumpsys storaged
    echo "===== installed 3rd-party packages ====="; adb shell pm list packages -3
    echo "===== end device state ====="
    exit 0
  displayName: diagnose install failure ${{ parameters.testName }}
  condition: failed()
  continueOnError: true
  timeoutInMinutes: 3

- script: |
    DEST="$(Build.StagingDirectory)/Test${{ parameters.configuration }}/${{ parameters.artifactFolder }}/"
    INTERMEDIATE_DIR="$(dirname "${{ parameters.project }}")/obj/${{ parameters.configuration }}/$(DotNetTargetFramework)-android/android/bin"
    mkdir -p "$DEST"
    cp "${{ parameters.artifactSource }}" "$DEST" || echo "copy apk/aab failed"
    cp "$INTERMEDIATE_DIR/packaged_resources" "$DEST/packaged_resources.zip" || echo "copy packaged_resources failed"
    cp "$INTERMEDIATE_DIR/base.zip" "$DEST" || echo "copy base.zip failed"
    for AAB in "$INTERMEDIATE_DIR"/*.aab; do
      if [ -f "$AAB" ]; then
        cp "$AAB" "$DEST"
      fi
    done
  displayName: copy package intermediates
  condition: ${{ parameters.condition }}
  continueOnError: true

  # Always capture full device logcat so we can diagnose native library load
  # failures, JNI crashes, instrumentation errors, etc. The Android-side
  # instrumentation output (Log.Info/Log.Error from TestInstrumentation) and
  # any UnsatisfiedLinkError / dlopen messages only appear in logcat.
  #
  # Use always() (not the default succeeded()) so we still capture logcat when an
  # earlier step failed or the job was canceled - in particular a failed -t:Install
  # (which now fails the lane fast) or a hung/timed-out test run. Losing logcat in
  # exactly those cases would defeat the diagnostics this template exists for; the
  # capture is best-effort, internally time-bounded, and always exits successfully
  # when diagnostics cannot be collected. Redirect both output streams so an adb
  # server started by the client cannot inherit the pipeline's output pipe and
  # keep this step open. See dotnet/android#11830 and dotnet/android#12704.
- script: |
    set +e
    DEST="$(Build.StagingDirectory)/Test${{ parameters.configuration }}/${{ parameters.artifactFolder }}"
    DEVICES_OUTPUT="$DEST/adb-devices-${{ parameters.testName }}.txt"
    LOGCAT_OUTPUT="$DEST/logcat-${{ parameters.testName }}.txt"
    DEVICES_ERROR="$(mktemp)"
    LOGCAT_ERROR="$(mktemp)"
    ADB_PID=""
    mkdir -p "$DEST"

    cleanup() {
      if [ -n "$ADB_PID" ]; then
        kill -KILL "$ADB_PID" 2>/dev/null
        wait "$ADB_PID" 2>/dev/null
      fi
      rm -f "$DEVICES_ERROR" "$LOGCAT_ERROR"
    }

    run_adb() {
      local TIMEOUT_SECONDS="$1"
      local OUTPUT="$2"
      local ERROR_OUTPUT="$3"
      local START_SECONDS="$SECONDS"
      local STATUS=0
      local ELAPSED=0
      shift 3

      echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') starting $*"
      "$@" > "$OUTPUT" 2> "$ERROR_OUTPUT" &
      ADB_PID=$!
      while kill -0 "$ADB_PID" 2>/dev/null; do
        ELAPSED=$((SECONDS - START_SECONDS))
        if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
          echo "$* timed out after ${TIMEOUT_SECONDS}s; bytes=$(wc -c < "$OUTPUT")"
          kill -KILL "$ADB_PID" 2>/dev/null
          wait "$ADB_PID" 2>/dev/null
          ADB_PID=""
          return 124
        fi
        sleep 1
      done

      wait "$ADB_PID"
      STATUS=$?
      ADB_PID=""
      ELAPSED=$((SECONDS - START_SECONDS))
      echo "$* finished; elapsed=${ELAPSED}s; exitCode=$STATUS; bytes=$(wc -c < "$OUTPUT")"
      return "$STATUS"
    }

    trap cleanup EXIT

    run_adb 10 "$DEVICES_OUTPUT" "$DEVICES_ERROR" adb devices
    DEVICES_STATUS=$?
    cat "$DEVICES_OUTPUT"
    cat "$DEVICES_ERROR"
    if [ "$DEVICES_STATUS" -ne 0 ]; then
      echo "logcat capture skipped: adb devices failed with exit code $DEVICES_STATUS"
      exit 0
    fi

    if ! awk 'NR > 1 && $2 == "device" { found=1 } END { exit !found }' "$DEVICES_OUTPUT"; then
      echo "logcat capture skipped: no connected device"
      exit 0
    fi

    run_adb 45 "$LOGCAT_OUTPUT" "$LOGCAT_ERROR" env ADB_TRACE=adb,shell adb logcat -d
    LOGCAT_STATUS=$?
    cat "$LOGCAT_ERROR"
    if [ "$LOGCAT_STATUS" -ne 0 ]; then
      echo "logcat capture failed with exit code $LOGCAT_STATUS; partial output was retained at $LOGCAT_OUTPUT"
    else
      echo "logcat capture completed: $LOGCAT_OUTPUT"
    fi
    exit 0
  displayName: capture logcat ${{ parameters.testName }}
  condition: always()

- task: PublishTestResults@2
  displayName: publish ${{ parameters.testName }} results
  inputs:
    testResultsFormat: ${{ parameters.testResultsFormat }}
    testResultsFiles: ${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/TestResults/${{ parameters.testName }}.trx
    testRunTitle: ${{ parameters.testName }}
  condition: ${{ parameters.condition }}

- template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
  parameters:
    configuration: ${{ parameters.buildConfiguration }}
    xaSourcePath: ${{ parameters.xaSourcePath }}
    project: ${{ parameters.project }}
    arguments: -t:Clean -c ${{ parameters.configuration }} --no-restore ${{ parameters.extraBuildArgs }}
    displayName: Clean ${{ parameters.testName }}
    condition: ${{ parameters.condition }}
    continueOnError: false
