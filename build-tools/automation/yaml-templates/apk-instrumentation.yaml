parameters:
  buildConfiguration: $(XA.Build.Configuration)
  configuration: $(XA.Build.Configuration)
  xaSourcePath: $(System.DefaultWorkingDirectory)
  testName: ""
  project: ""
  extraBuildArgs: ""
  testResultsFormat: VSTest
  artifactSource: ""
  artifactFolder: ""
  condition: succeeded()

steps:
  # Build and install the APK to the device first, so that ComputeRunArguments
  # can resolve the package name from AndroidManifest.xml.
  #
  # Retry the install up to 3 times: the emulator/ADB connection occasionally
  # drops mid-install (XAGCPU7000 "device offline") and a retry usually recovers.
  # If every attempt fails, continueOnError: false fails the lane immediately -
  # there is no point running the tests against a device where the app was never
  # installed (that only wastes CI time and produces a misleading
  # INSTRUMENTATION_FAILED). See dotnet/android#11830.
- template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
  parameters:
    configuration: ${{ parameters.buildConfiguration }}
    xaSourcePath: ${{ parameters.xaSourcePath }}
    displayName: build ${{ parameters.testName }}
    project: ${{ parameters.project }}
    arguments: >-
      -t:Install
      -bl:${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/build-${{ parameters.testName }}.binlog
      -c ${{ parameters.configuration }} ${{ parameters.extraBuildArgs }}
    condition: ${{ parameters.condition }}
    retryCountOnTaskFailure: 3
    continueOnError: false

  # If the install above failed, snapshot device state so we can classify WHY on
  # the next iteration instead of guessing: connectivity (adb devices/get-state),
  # disk pressure (df), storage-service readiness (the StorageStatsManager NPE
  # from install-create), boot completion, and how many test apps have piled up.
  # Best-effort and time-bounded so it never hangs or fails the lane itself.
- script: |
    set +e
    echo "===== adb devices -l ====="; adb devices -l
    echo "===== adb get-state ====="; adb get-state
    echo "===== boot completion ====="; adb shell getprop sys.boot_completed; adb shell getprop dev.bootcomplete
    echo "===== df /data ====="; adb shell df /data
    echo "===== df /storage/emulated/0 ====="; adb shell df /storage/emulated/0
    echo "===== dumpsys diskstats ====="; adb shell dumpsys diskstats
    echo "===== storaged (storage stats service) ====="; adb shell dumpsys storaged
    echo "===== installed 3rd-party packages ====="; adb shell pm list packages -3
    echo "===== end device state ====="
    exit 0
  displayName: diagnose install failure ${{ parameters.testName }}
  condition: failed()
  continueOnError: true
  timeoutInMinutes: 3

  # WORKAROUND: 'dotnet test' currently fails to deploy to a device (dotnet/android#12254),
  # so drive the instrumentation with 'dotnet run' instead.
  #
  # We do not lose the test report by doing so: the on-device test runner writes its
  # own TRX (tests/TestRunner.Core/TestInstrumentation.cs) and reports the location
  # back through the instrumentation bundle as
  # 'INSTRUMENTATION_RESULT: resultsPath=<device path>'. 'dotnet run' invokes
  # 'adb shell am instrument -w', which prints that bundle, so we can scrape the path
  # and pull the TRX to where PublishTestResults expects it.
  #
  # Revert to 'dotnet test' once the SDK fix flows in.
- powershell: |
    $ErrorActionPreference = "Continue"
    $projectDir = Split-Path -Parent "${{ parameters.project }}"
    $projectFile = Split-Path -Leaf "${{ parameters.project }}"
    $resultsDir = "${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/TestResults"
    New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
    Push-Location $projectDir
    if ([Environment]::OSVersion.Platform -eq "Unix") {
        $DOTNET_ROOT = "${{ parameters.xaSourcePath }}/bin/${{ parameters.buildConfiguration }}/dotnet"
        $env:PATH = "${DOTNET_ROOT}:$env:PATH"
        $dotnetPath = "${DOTNET_ROOT}/dotnet"
    } else {
        $DOTNET_ROOT = "${{ parameters.xaSourcePath }}\bin\${{ parameters.buildConfiguration }}\dotnet"
        $env:PATH = "${DOTNET_ROOT};$env:PATH"
        $dotnetPath = "${DOTNET_ROOT}\dotnet.exe"
    }
    # 'dotnet run' deploys to the device with an in-process MSBuild, which skips the
    # MSBuildForwardingApp that normally sets DOTNET_HOST_PATH. Without it, MSBuild
    # cannot launch task hosts (MSB4221 on ILLink's ComputeManagedAssemblies).
    $env:DOTNET_HOST_PATH = $dotnetPath
    & $dotnetPath run --project $projectFile --no-build -bl:${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/run-${{ parameters.testName }}.binlog -c ${{ parameters.configuration }} ${{ parameters.extraBuildArgs }} 2>&1 | Tee-Object -Variable runOutput
    $runExitCode = $LASTEXITCODE
    Pop-Location
    $match = $runOutput | Select-String -Pattern 'INSTRUMENTATION_RESULT:\s*resultsPath=(.+)$' | Select-Object -Last 1
    if (-not $match) {
        Write-Host "##vso[task.logissue type=error]Instrumentation did not report a resultsPath; no TRX to publish. 'dotnet run' exited with $runExitCode."
        exit 1
    }
    $devicePath = $match.Matches[0].Groups[1].Value.Trim()
    $trxPath = "$resultsDir/${{ parameters.testName }}.trx"
    Write-Host "Pulling TRX from device: $devicePath"
    & adb pull "$devicePath" "$trxPath"
    if (-not (Test-Path $trxPath)) {
        Write-Host "##vso[task.logissue type=error]Failed to pull TRX from device path '$devicePath'."
        exit 1
    }
    exit $runExitCode
  displayName: run ${{ parameters.testName }}
  condition: ${{ parameters.condition }}
  continueOnError: true

- script: >
    DEST="$(Build.StagingDirectory)/Test${{ parameters.configuration }}/${{ parameters.artifactFolder }}/" &&
    mkdir -p "$DEST" &&
    cp "${{ parameters.artifactSource }}" "$DEST" ||
    echo "copy apk/aab failed"  # We don't need to report the error
  displayName: copy apk/aab
  condition: ne(variables['Agent.JobStatus'], 'Succeeded')
  continueOnError: true

  # Always capture full device logcat so we can diagnose native library load
  # failures, JNI crashes, instrumentation errors, etc. The Android-side
  # instrumentation output (Log.Info/Log.Error from TestInstrumentation) and
  # any UnsatisfiedLinkError / dlopen messages only appear in logcat.
  #
  # Use always() (not the default succeeded()) so we still capture logcat when an
  # earlier step failed or the job was canceled - in particular a failed -t:Install
  # (which now fails the lane fast) or a hung/timed-out test run. Losing logcat in
  # exactly those cases would defeat the diagnostics this template exists for; the
  # capture is best-effort (continueOnError + '|| echo'). See dotnet/android#11830.
- script: >
    DEST="$(Build.StagingDirectory)/Test${{ parameters.configuration }}/${{ parameters.artifactFolder }}/" &&
    mkdir -p "$DEST" &&
    adb logcat -d > "$DEST/logcat-${{ parameters.testName }}.txt" ||
    echo "logcat capture failed"
  displayName: capture logcat ${{ parameters.testName }}
  condition: always()
  continueOnError: true

- task: PublishTestResults@2
  displayName: publish ${{ parameters.testName }} results
  inputs:
    testResultsFormat: ${{ parameters.testResultsFormat }}
    testResultsFiles: ${{ parameters.xaSourcePath }}/bin/Test${{ parameters.configuration }}/TestResults/${{ parameters.testName }}.trx
    testRunTitle: ${{ parameters.testName }}
  condition: ${{ parameters.condition }}

- template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
  parameters:
    configuration: ${{ parameters.buildConfiguration }}
    xaSourcePath: ${{ parameters.xaSourcePath }}
    project: ${{ parameters.project }}
    arguments: -t:Clean -c ${{ parameters.configuration }} --no-restore ${{ parameters.extraBuildArgs }}
    displayName: Clean ${{ parameters.testName }}
    condition: ${{ parameters.condition }}
    continueOnError: false
