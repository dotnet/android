parameters:
  testAssembly: ''        # NUnit test assembly to run; it must use Microsoft.Testing.Platform
  testFilter: ''          # Filter used to select tests (Microsoft.Testing.Platform --filter syntax, for example: TestCategory!=Localization)
  testRunTitle: ''        # Title of the test run
  xaSourcePath: $(System.DefaultWorkingDirectory)
  retryFailedTests: true  # Retry failed tests once
  condition: succeeded()  # Condition to run tests

steps:
# Use the SDK installed during test setup, so the net11.0 test assembly can load.
# Run-SlicedTests.ps1 fails if this job's slice has no tests.
- pwsh: >-
    ./build-tools/automation/scripts/Run-SlicedTests.ps1
    -DotNet "${{ parameters.xaSourcePath }}/bin/$(XA.Build.Configuration)/dotnet/dotnet"
    -TestAssembly "${{ parameters.testAssembly }}"
    -ResultsDirectory "$(Agent.TempDirectory)/TestResults"
    -SliceNumber $(System.JobPositionInPhase)
    -TotalSlices $(System.TotalJobsInPhase)
    -TestFilter "$env:TEST_FILTER"
    -Workers $(NUnit.NumberOfTestWorkers)
    -RetryFailedTests:$${{ parameters.retryFailedTests }}
  displayName: run ${{ parameters.testRunTitle }}
  workingDirectory: ${{ parameters.xaSourcePath }}
  condition: ${{ parameters.condition }}
  continueOnError: true
  timeoutInMinutes: 180
  env:
    TEST_FILTER: ${{ parameters.testFilter }}

- template: /build-tools/automation/yaml-templates/diagnose-hanging-processes.yaml

# When tests are retried, Run-SlicedTests.ps1 removes the failed results from this file
- task: PublishTestResults@2
  displayName: publish ${{ parameters.testRunTitle }} results
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: $(Agent.TempDirectory)/TestResults/*.trx
    testRunTitle: ${{ parameters.testRunTitle }}-$(System.JobPositionInPhase)
  condition: ${{ parameters.condition }}

- task: PublishTestResults@2
  displayName: publish ${{ parameters.testRunTitle }} (Auto-Retry) results
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: $(Agent.TempDirectory)/TestResults/retry/*.trx
    testRunTitle: ${{ parameters.testRunTitle }}-$(System.JobPositionInPhase) (Auto-Retry)
  condition: and(${{ parameters.condition }}, eq(variables['TestsRetried'], 'true'))

- template: /build-tools/automation/yaml-templates/kill-processes.yaml
