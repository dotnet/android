parameters:
  targetMinutes: 15
  workItemTimeout: '00:30:00'
  helixQueue: windows.11.amd64.android.open
  testCases:
  - name: debug
    displayName: Mono.Android.NET_Tests-Debug
    configuration: Debug
    project: tests/Mono.Android-Tests/Mono.Android-Tests/Mono.Android.NET-Tests.csproj
    artifactSource: bin/TestDebug/$(DotNetTargetFramework)-android/Mono.Android.NET_Tests-Signed.apk
    packageName: Mono.Android.NET_Tests
    instrumentation: xamarin.android.runtimetests.TestInstrumentation
    extraBuildArguments: ''
  - name: release
    displayName: Mono.Android.NET_Tests-Release
    configuration: $(XA.Build.Configuration)
    project: tests/Mono.Android-Tests/Mono.Android-Tests/Mono.Android.NET-Tests.csproj
    artifactSource: bin/Test$(XA.Build.Configuration)/$(DotNetTargetFramework)-android/Mono.Android.NET_Tests-Signed.apk
    packageName: Mono.Android.NET_Tests
    instrumentation: xamarin.android.runtimetests.TestInstrumentation
    extraBuildArguments: ''
  - name: no-aab
    displayName: Mono.Android.NET_Tests-NoAab
    configuration: $(XA.Build.Configuration)
    project: tests/Mono.Android-Tests/Mono.Android-Tests/Mono.Android.NET-Tests.csproj
    artifactSource: bin/Test$(XA.Build.Configuration)/$(DotNetTargetFramework)-android/Mono.Android.NET_Tests-Signed.apk
    packageName: Mono.Android.NET_Tests
    instrumentation: xamarin.android.runtimetests.TestInstrumentation
    extraBuildArguments: '-p:TestsFlavor=NoAab'
  - name: coreclr
    displayName: Mono.Android.NET_Tests-CoreCLR
    configuration: $(XA.Build.Configuration)
    project: tests/Mono.Android-Tests/Mono.Android-Tests/Mono.Android.NET-Tests.csproj
    artifactSource: bin/Test$(XA.Build.Configuration)/$(DotNetTargetFramework)-android/Mono.Android.NET_Tests-Signed.apk
    packageName: Mono.Android.NET_Tests
    instrumentation: xamarin.android.runtimetests.TestInstrumentation
    extraBuildArguments: '-p:TestsFlavor=CoreCLR -p:UseMonoRuntime=false'
  - name: mono
    displayName: Mono.Android.NET_Tests-Mono
    configuration: $(XA.Build.Configuration)
    project: tests/Mono.Android-Tests/Mono.Android-Tests/Mono.Android.NET-Tests.csproj
    artifactSource: bin/Test$(XA.Build.Configuration)/$(DotNetTargetFramework)-android/Mono.Android.NET_Tests-Signed.apk
    packageName: Mono.Android.NET_Tests
    instrumentation: xamarin.android.runtimetests.TestInstrumentation
    extraBuildArguments: '-p:UseMonoRuntime=true -p:_DisableCheckForUnsupportedMonoMobileRuntime=true'
  - name: coreclr-trimmable
    displayName: Mono.Android.NET_Tests-CoreCLRTrimmable
    configuration: $(XA.Build.Configuration)
    project: tests/Mono.Android-Tests/Mono.Android-Tests/Mono.Android.NET-Tests.csproj
    artifactSource: bin/Test$(XA.Build.Configuration)/$(DotNetTargetFramework)-android/Mono.Android.NET_Tests-Signed.apk
    packageName: Mono.Android.NET_Tests
    instrumentation: xamarin.android.runtimetests.TestInstrumentation
    extraBuildArguments: '-p:TestsFlavor=CoreCLRTrimmable -p:AndroidTypeMapImplementation=trimmable -p:UseMonoRuntime=false'
  - name: nativeaot
    displayName: Mono.Android.NET_Tests-NativeAOT
    configuration: $(XA.Build.Configuration)
    project: tests/Mono.Android-Tests/Mono.Android-Tests/Mono.Android.NET-Tests.csproj
    artifactSource: bin/Test$(XA.Build.Configuration)/$(DotNetTargetFramework)-android/Mono.Android.NET_Tests-Signed.apk
    packageName: Mono.Android.NET_Tests
    instrumentation: xamarin.android.runtimetests.TestInstrumentation
    extraBuildArguments: '-p:TestsFlavor=NativeAOT -p:PublishAot=true'
  - name: jcwgen
    displayName: Xamarin.Android.JcwGen_Tests
    configuration: $(XA.Build.Configuration)
    project: tests/CodeGen-Binding/Xamarin.Android.JcwGen-Tests/Xamarin.Android.JcwGen-Tests.csproj
    artifactSource: bin/Test$(XA.Build.Configuration)/$(DotNetTargetFramework)-android/Xamarin.Android.JcwGen_Tests-Signed.apk
    packageName: Xamarin.Android.JcwGen_Tests
    instrumentation: xamarin.android.jcwgentests.TestInstrumentation
    extraBuildArguments: ''

steps:
- template: /build-tools/automation/yaml-templates/setup-test-environment-public.yaml
  parameters:
    useAgentJdkPath: false
    use1ESTemplate: false

- pwsh: |
    $ErrorActionPreference = 'Stop'
    $androidSdk = @(
      $env:ANDROID_HOME
      $env:ANDROID_SDK_ROOT
      $env:AndroidSdkDirectory
      $(if ($env:USERPROFILE) { Join-Path $env:USERPROFILE 'android-toolchain\sdk' })
      $(if ($env:HOME) { Join-Path $env:HOME 'android-toolchain/sdk' })
    ) | Where-Object { $_ -and (Test-Path (Join-Path $_ 'platform-tools')) } | Select-Object -First 1
    if (-not $androidSdk) {
      throw 'Could not locate the prepared Android SDK.'
    }
    New-Item -ItemType Directory -Force -Path '$(Build.StagingDirectory)/apk-tests-helix/results' | Out-Null
    Write-Host "##vso[task.setvariable variable=ApkTestsAndroidSdkDirectory]$androidSdk"
  displayName: Resolve APK test build paths

- task: DownloadPipelineArtifact@2
  inputs:
    artifactName: $(TestAssembliesArtifactName)
    downloadPath: $(System.DefaultWorkingDirectory)/bin/Test$(XA.Build.Configuration)

- task: DotNetCoreCLI@2
  displayName: Build BootstrapTasks Debug
  inputs:
    projects: $(System.DefaultWorkingDirectory)/build-tools/Xamarin.Android.Tools.BootstrapTasks/Xamarin.Android.Tools.BootstrapTasks.csproj
    arguments: -c Debug -bl:$(Build.StagingDirectory)/apk-tests-helix/BootstrapTasks-Debug.binlog

- template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
  parameters:
    project: Xamarin.Android.slnx
    arguments: -t:PrepareJavaInterop -c Debug --no-restore
    displayName: Prepare Java.Interop Debug
    continueOnError: false

- template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
  parameters:
    project: Xamarin.Android.slnx
    arguments: -t:PrepareJavaInterop -c $(XA.Build.Configuration) --no-restore
    displayName: Prepare Java.Interop $(XA.Build.Configuration)
    continueOnError: false

- ${{ each testCase in parameters.testCases }}:
  - template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
    parameters:
      command: build
      project: ${{ testCase.project }}
      arguments: >-
        -t:Clean
        -c ${{ testCase.configuration }}
        -p:AndroidSdkDirectory="$(ApkTestsAndroidSdkDirectory)"
        -p:JavaSdkDirectory="$(JAVA_HOME)"
        ${{ testCase.extraBuildArguments }}
      displayName: Clean APK payload - ${{ testCase.displayName }}
      continueOnError: false

  - pwsh: |
      $apk = '$(System.DefaultWorkingDirectory)\${{ testCase.artifactSource }}'
      Remove-Item -LiteralPath $apk -Force -ErrorAction Ignore
      $projectDirectory = Split-Path -Parent '$(System.DefaultWorkingDirectory)\${{ testCase.project }}'
      $manifest = Join-Path $projectDirectory 'obj\Helix\${{ testCase.name }}\AndroidManifest.xml'
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $manifest) | Out-Null
      @'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${{ testCase.packageName }}">
        <application />
        <instrumentation android:name="${{ testCase.instrumentation }}" android:targetPackage="${{ testCase.packageName }}" />
      </manifest>
      '@ | Set-Content -LiteralPath $manifest -Encoding utf8NoBOM
    displayName: Remove stale APK - ${{ testCase.displayName }}

  - template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
    parameters:
      command: build
      project: ${{ testCase.project }}
      arguments: >-
        -t:SignAndroidPackage
        -c ${{ testCase.configuration }}
        -p:AndroidPackageFormat=apk
        -p:CustomAfterMicrosoftCommonTargets="$(System.DefaultWorkingDirectory)/build-tools/automation/apk-tests-helix/HelixInstrumentationManifest.targets"
        -p:HelixInstrumentationProject="$(System.DefaultWorkingDirectory)/${{ testCase.project }}"
        -p:HelixInstrumentationManifest="obj/Helix/${{ testCase.name }}/AndroidManifest.xml"
        -p:AndroidSdkDirectory="$(ApkTestsAndroidSdkDirectory)"
        -p:JavaSdkDirectory="$(JAVA_HOME)"
        ${{ testCase.extraBuildArguments }}
        -bl:$(Build.StagingDirectory)/apk-tests-helix/build-${{ testCase.name }}.binlog
      displayName: Build APK payload - ${{ testCase.displayName }}
      continueOnError: false

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $payloadDirectory = '$(Build.StagingDirectory)/apk-tests-helix/work-items/${{ testCase.name }}'
      New-Item -ItemType Directory -Force -Path $payloadDirectory | Out-Null
      $apk = '$(System.DefaultWorkingDirectory)/${{ testCase.artifactSource }}'
      if (-not (Test-Path -LiteralPath $apk -PathType Leaf)) {
        throw "Could not find APK '$apk' for ${{ testCase.displayName }}."
      }
      Copy-Item -LiteralPath $apk -Destination (Join-Path $payloadDirectory 'app.apk')

      $aapt = Get-ChildItem '$(ApkTestsAndroidSdkDirectory)\build-tools' -Recurse -Filter 'aapt.exe' |
        Sort-Object FullName -Descending |
        Select-Object -First 1
      if (-not $aapt) {
        throw 'Could not locate aapt.exe to inspect the APK manifest.'
      }
      $badging = @(& $aapt.FullName dump badging $apk)
      if ($LASTEXITCODE -ne 0) {
        throw "aapt dump badging failed with exit code $LASTEXITCODE."
      }
      $instrumentationMatch = [regex]::Match(
        ($badging -join "`n"),
        "(?m)^instrumentation:.*name='(?<name>[^']+)'.*targetPackage='(?<package>[^']+)'"
      )
      if (-not $instrumentationMatch.Success) {
        $badging | Write-Host
        throw "APK '$apk' does not contain an instrumentation entry."
      }
      $packageName = $instrumentationMatch.Groups['package'].Value
      $instrumentation = $instrumentationMatch.Groups['name'].Value
      Write-Host "APK instrumentation: $packageName/$instrumentation"

      [pscustomobject]@{
        name = '${{ testCase.name }}'
        displayName = '${{ testCase.displayName }}'
        packageName = $packageName
        instrumentation = $instrumentation
      } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $payloadDirectory 'case.json') -Encoding utf8NoBOM
    displayName: Stage APK payload - ${{ testCase.displayName }}

  - pwsh: |
      $dotnet = '$(System.DefaultWorkingDirectory)\bin\$(XA.Build.Configuration)\dotnet\dotnet.exe'
      & $dotnet build-server shutdown
      exit $LASTEXITCODE
    displayName: Shut down build servers - ${{ testCase.displayName }}

- pwsh: |
    $ErrorActionPreference = 'Stop'
    $platformTools = Join-Path '$(ApkTestsAndroidSdkDirectory)' 'platform-tools'
    if (-not (Test-Path -LiteralPath $platformTools -PathType Container)) {
      throw 'Could not locate Android platform-tools.'
    }
    & '$(System.DefaultWorkingDirectory)/build-tools/automation/apk-tests-helix/prepare-apk-test-helix-submission.ps1' `
      -WorkItemsDirectory '$(Build.StagingDirectory)/apk-tests-helix/work-items' `
      -ItemsPropsPath '$(Build.StagingDirectory)/apk-tests-helix/work-items.props' `
      -ResultsDirectory '$(Build.StagingDirectory)/apk-tests-helix/results' `
      -PlatformToolsDirectory $platformTools `
      -TargetMinutes ${{ parameters.targetMinutes }}
  displayName: Prepare APK test Helix submission

- template: /build-tools/automation/yaml-templates/run-dotnet-preview.yaml
  parameters:
    command: msbuild
    project: $(System.DefaultWorkingDirectory)/build-tools/automation/ApkTestsHelix.proj
    arguments: >-
      /restore
      /t:Test
      /p:TreatWarningsAsErrors=false
      /bl:$(Build.StagingDirectory)/apk-tests-helix/results/send-to-helix.binlog
    displayName: Submit APK tests to Helix
    continueOnError: false
    taskTimeoutInMinutes: 180
    env:
      ApkTestsHelixItemsProps: $(ApkTestsHelixItemsProps)
      ApkTestsHelixWorkItemTimeout: ${{ parameters.workItemTimeout }}
      HelixResultsDestinationDir: $(Build.StagingDirectory)/apk-tests-helix/results
      HelixSource: pr/dotnet/android
      HelixType: tests/android/apk-tests/
      HelixBuild: $(Build.BuildNumber)
      HelixConfiguration: apk-tests
      HelixTargetQueueForItem: ${{ parameters.helixQueue }}
      HelixTestRunName: Android APK Tests - Helix Prototype
      HelixAccessToken: ''
      WaitForWorkItemCompletion: 'true'
      Creator: dotnet-android

- task: PublishTestResults@2
  displayName: Publish APK Helix TRX results
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '**/*.trx'
    searchFolder: $(Build.StagingDirectory)/apk-tests-helix/results
    mergeTestResults: false
    testRunTitle: Android APK Tests - Helix Prototype

- task: PublishPipelineArtifact@1
  displayName: Publish APK Helix diagnostics
  condition: always()
  inputs:
    artifactName: APK Test Helix Results
    targetPath: $(Build.StagingDirectory)/apk-tests-helix/results
