# Members of JNI-facing types are preserved by proguard_typemap_members.cfg.
# Java-only dependencies remain eligible for member shrinking.

# Manifest providers and native runtime bootstrap entry points.
-keep class net.dot.android.CoreClrRuntimeProvider* { *; }
-keep class net.dot.android.CoreClrPackageManager { *; }
-keep class net.dot.android.CoreClrPackageManager_Resources { *; }
-keep class net.dot.android.NativeLibraryHelper { public static void loadLibrary(java.lang.String); }
-keep class net.dot.android.Runtime { *; }
-keep interface net.dot.android.IGCUserPeer { *; }
-keep class net.dot.android.GCUserPeer { *; }
-keep class net.dot.android.ApplicationRegistration { *; }
-keep class net.dot.android.crypto.** { *; <init>(...); }

# Managed interface proxy selection observes Class.getInterfaces().
-keep,allowshrinking class * implements **

# Framework-driven view inflation and property setters.
-keepclassmembers class * extends android.view.View {
   *** set*(...);
   <init>(android.content.Context,android.util.AttributeSet);
   <init>(android.content.Context,android.util.AttributeSet,int);
}
