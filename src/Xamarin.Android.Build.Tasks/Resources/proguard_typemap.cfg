# Class-only shrinking for the retained typemap pipeline. JNI member liveness
# is deliberately independent of the generated class roots.
-keepclassmembers class * {
   *;
}

# Java.Interop resolves these support classes by name.
-keep class net.dot.jni.ManagedPeer
-keep interface net.dot.jni.GCUserPeerable
-keep class net.dot.jni.internal.JavaProxyObject
-keep class net.dot.jni.internal.JavaProxyThrowable
# Manifest providers and their runtime bootstrap entry points.
-keep class net.dot.jni.nativeaot.NativeAotRuntimeProvider
-keep class net.dot.jni.nativeaot.JavaInteropRuntime
-keep class net.dot.jni.nativeaot.NativeAotEnvironmentVars
-keep class mono.MonoRuntimeProvider*
-keep class mono.MonoPackageManager
-keep class mono.MonoPackageManager_Resources
# Native hosts resolve Runtime and its GC peer interfaces by name.
-keep class mono.android.Runtime
-keep interface mono.android.IGCUserPeer
-keep class mono.android.GCUserPeer
# Loaded by name from managed code.
-keep class net.dot.android.ApplicationRegistration { *; }
-keep class net.dot.android.crypto.** { *; <init>(...); }
# Native hosts resolve these package-private fields by name during startup.
-keepclassmembers class mono.android.Runtime {
   static java.lang.Class *;
}

-keepclassmembers class * extends android.view.View {
   *** set*(...);
}

-keepclassmembers class * extends android.view.View {
   <init>(android.content.Context,android.util.AttributeSet);
   <init>(android.content.Context,android.util.AttributeSet,int);
}
