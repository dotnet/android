import proguard.gradle.ProGuardTask

buildscript {
    apply from: "${rootDir}/../../eng/gradle/dependency-repositories.gradle", to: buildscript
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.10.0'
    }
}

plugins {
    id 'java-library'
}

java {
    ext.javaSourceVer = project.hasProperty('javaSourceVer') ? JavaVersion.toVersion(project.getProperty('javaSourceVer')) : JavaVersion.VERSION_1_8
    ext.javaTargetVer = project.hasProperty('javaTargetVer') ? JavaVersion.toVersion(project.getProperty('javaTargetVer')) : JavaVersion.VERSION_1_8

    sourceCompatibility = ext.javaSourceVer
    targetCompatibility = ext.javaTargetVer
}

dependencies {
    // https://mvnrepository.com/artifact/com.android.tools.build/manifest-merger
    implementation 'com.android.tools.build:manifest-merger:32.4.1'
    // ILogger is needed at compile time for the LenientMerger subclass, but
    // manifest-merger declares common with runtime scope only.
    implementation 'com.android.tools:common:32.4.1'
}

sourceSets {
    main {
        java {
            srcDirs = ["src"]
        }
    }
}

jar {
    duplicatesStrategy = 'exclude'
    manifest {
        attributes 'Main-Class': 'com.xamarin.manifestmerger.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        // Exclude native jnidispatch content to simplify installer signing and notarization
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA', 'com/sun/jna/**/*jnidispatch*'
    }
    archiveFileName.set('manifestmerger-unshrunk.jar')
}

tasks.register('proguard', ProGuardTask) {
    configuration file('proguard.pro')
    injars(tasks.named('jar', Jar).flatMap { it.archiveFile })
    libraryjars fileTree("${System.getProperty('java.home')}/jmods") {
        include '*.jmod'
    }, jarfilter: '!**.jar', filter: '!module-info.class'
    outjars(layout.buildDirectory.file('libs/manifestmerger.jar'))
}

tasks.named('assemble') {
    dependsOn tasks.named('proguard')
}
