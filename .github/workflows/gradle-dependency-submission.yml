name: Gradle dependency submission

on:
  push:
    branches:
      - main
    paths: &paths
      - ".github/dependabot.yml"
      - ".github/workflows/gradle-dependency-submission.yml"
      - "Configuration.props"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/gradle.properties"
      - "**/gradle-wrapper.properties"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: gradle-dependency-submission-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    if: github.repository_owner == 'dotnet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      directories: ${{ steps.inputs.outputs.directories }}
      java: ${{ steps.inputs.outputs.java }}
      source: ${{ steps.inputs.outputs.source }}
      target: ${{ steps.inputs.outputs.target }}
      gradle: ${{ steps.inputs.outputs.gradle }}
    steps:
      - uses: actions/checkout@v7

      - id: inputs
        shell: pwsh
        run: |
          $pathsJson = yq -o=json -I=0 '[.updates[] | select(."package-ecosystem" == "gradle") | (.directories // [.directory])[] | sub("^/", "")] | unique' .github/dependabot.yml
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot read Gradle directories from dependabot.yml.'
          }
          "directories=$pathsJson" >> $env:GITHUB_OUTPUT

          $config = Get-Content Configuration.props -Raw
          foreach ($property in @{ java = 'MicrosoftOpenJDKVersion'; source = 'JavacSourceVersion'; target = 'JavacTargetVersion' }.GetEnumerator()) {
            if ($config -notmatch "<$($property.Value)\b[^>]*>([^<$]+)<") {
              throw "Cannot read $($property.Value) from Configuration.props."
            }
            "$($property.Key)=$($Matches[1])" >> $env:GITHUB_OUTPUT
          }
          $wrapper = Get-Content build-tools/gradle/gradle/wrapper/gradle-wrapper.properties -Raw
          if ($wrapper -notmatch '(?m)^distributionUrl=.*gradle-(.+)-(?:bin|all)\.zip\r?$') {
            throw 'Cannot determine Gradle version from the wrapper.'
          }
          "gradle=$($Matches[1])" >> $env:GITHUB_OUTPUT

  dependency-graph:
    name: ${{ matrix.build-root-directory }}
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build-root-directory: ${{ fromJSON(needs.setup.outputs.directories) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: ${{ needs.setup.outputs.java }}

      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: ${{ matrix.build-root-directory }}
          gradle-version: ${{ needs.setup.outputs.gradle }}
          additional-arguments: >-
            -PjavaSourceVer=${{ needs.setup.outputs.source }}
            -PjavaTargetVer=${{ needs.setup.outputs.target }}
          dependency-graph: generate-and-upload
          cache-provider: basic

  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: dependency-graph
    permissions:
      contents: write
    steps:
      - uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: download-and-submit
